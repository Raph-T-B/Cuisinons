<div class="min-h-[calc(100vh-5rem)] flex items-center justify-center bg-gradient-to-br from-amber-50 via-orange-50 to-orange-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-orange-100 p-8 space-y-6">
    <div class="text-center">
      <span class="inline-block p-3 rounded-full bg-orange-100 text-orange-600 text-4xl mb-3 shadow-inner">
        🍳
      </span>
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
        Bienvenue sur Cuisinons
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Connectez-vous pour découvrir, noter et partager vos recettes.
      </p>
    </div>

    <!-- Instructions / Règles d'authentification -->
    <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg text-xs text-amber-800 space-y-1">
      <p class="font-semibold text-amber-900">Règles de connexion :</p>
      <ul class="list-disc list-inside space-y-0.5 text-amber-700">
        <li>Login et mot de passe <strong>identiques</strong></li>
        <li>Au moins <strong>5 caractères</strong></li>
        <li>Au moins <strong>1 chiffre</strong></li>
        <li>Au moins <strong>1 caractère spécial</strong> parmi : <code class="bg-amber-100 px-1 py-0.5 rounded font-mono font-bold">./*-+</code></li>
      </ul>
    </div>

    @if (errorMessage) {
      <div class="p-3 bg-red-50 border-l-4 border-red-500 rounded-r text-red-700 text-sm flex items-center gap-2">
        <span>⚠️</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="login" class="block text-sm font-medium text-gray-700 mb-1">
          Identifiant (Login)
        </label>
        <input
          id="login"
          type="text"
          [(ngModel)]="login"
          name="login"
          placeholder="Ex: Chef2026*"
          required
          class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-gray-900 text-sm transition"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Mot de passe
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Identique au login"
          required
          class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 text-gray-900 text-sm transition"
        />
      </div>

      <button
        type="submit"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition cursor-pointer"
      >
        Se connecter
      </button>
    </form>
  </div>
</div>
